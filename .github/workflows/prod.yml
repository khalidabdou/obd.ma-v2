name: Frontend V2 CI/CD (Production)

on:
  push:
    branches:
      - main
      - prod

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/obd-frontend-v2

jobs:
  # CI Job - Build and test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.obd.ma/api
          NEXT_PUBLIC_APP_URL: https://obd.ma/

  # CD Job - Deploy
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:prod
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:prod,ignore-error=true
          cache-to: type=inline

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e

            PROJECT_PATH="${{ secrets.PROD_PATH }}"
            CONTAINER_NAME="obd-frontend-v2-prod"

            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="$HOME/prod"
            fi

            echo "🚀 Deploying Frontend V2 to Production"
            echo "📁 Project path: $PROJECT_PATH"
            cd "$PROJECT_PATH"

            # ================================================
            # Step 0: Authenticate with Docker Hub
            # ================================================
            echo "🐳 Logging into Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # ================================================
            # Step 1: Stop & remove old container
            # ================================================
            echo "🛑 Step 1: Stopping existing container..."
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            docker container prune -f || true

            # ================================================
            # Step 2: Pull latest image
            # ================================================
            echo "📥 Step 2: Pulling latest image..."
            docker compose pull frontend-v2

            # ================================================
            # Step 3: Start the new container
            # ================================================
            echo "🔄 Step 3: Starting frontend-v2 container..."
            docker compose up -d --no-deps --force-recreate --remove-orphans frontend-v2

            # ================================================
            # Step 4: Health check
            # ================================================
            echo "⏳ Step 4: Waiting for frontend to be ready..."
            sleep 10

            if docker ps | grep -q $CONTAINER_NAME; then
              echo "✅ Container is running!"
              echo "  Checking application health..."
              i=1
              while [ $i -le 60 ]; do
                if docker logs $CONTAINER_NAME 2>&1 | grep -q "Ready in\|started server\|Local:"; then
                  echo "  ✅ Application started successfully!"
                  break
                fi
                if [ $i -eq 60 ]; then
                  echo "⚠️ Timeout waiting for app to start, but container is running."
                  docker logs --tail 50 $CONTAINER_NAME
                fi
                sleep 2
                i=$((i + 1))
              done
            else
              echo "❌ Container failed to start!"
              docker logs $CONTAINER_NAME 2>&1 || true
              exit 1
            fi

            # ================================================
            # Step 5: Cleanup old images
            # ================================================
            echo "🧹 Step 5: Cleaning up old images..."
            docker image prune -f

            echo ""
            echo "=========================================="
            echo "✅ Frontend V2 deployment to production completed!"
            echo "=========================================="
            echo "📊 Container status:"
            docker ps | grep $CONTAINER_NAME || echo "Warning: Container not found"
            echo ""
            echo "📋 Recent logs:"
            docker logs --tail 20 $CONTAINER_NAME 2>&1 || true

            docker logout
